<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1d52"/><stop offset=".6" stop-color="#151226"/><stop offset="1" stop-color="#0d0c14"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".3" r=".6"><stop offset="0" stop-color="#b9a3ff" stop-opacity=".35"/><stop offset="1" stop-color="#b9a3ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="460" height="215" fill="url(#bg)"/>
  <rect width="460" height="215" fill="url(#spot)"/>
  <!-- high bar -->
  <line x1="118" y1="215" x2="118" y2="70" stroke="#6c6f86" stroke-width="4"/>
  <line x1="222" y1="215" x2="222" y2="70" stroke="#6c6f86" stroke-width="4"/>
  <line x1="108" y1="72" x2="232" y2="72" stroke="#e8e4ff" stroke-width="5" stroke-linecap="round"/>
  <!-- release arc -->
  <path d="M170 72 C 210 -10, 300 -5, 330 80" fill="none" stroke="#b9a3ff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".8"/>
  <!-- ghost frames along the arc -->
  <g fill="#b9a3ff" opacity=".25"><circle cx="205" cy="28" r="7"/><circle cx="252" cy="14" r="7"/></g>
  <!-- tucked gymnast at the top of the flip -->
  <g transform="translate(300 40) rotate(40)" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-16" r="8" fill="#fff" stroke="none"/>
    <path d="M0 -6 L2 12"/>
    <path d="M2 12 L18 4 L10 -10"/>
    <path d="M0 -4 L14 -2"/>
  </g>
  <!-- mat -->
  <rect x="280" y="176" width="150" height="12" rx="6" fill="#b9a3ff" opacity=".35"/>
  <text x="26" y="190" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#fff" letter-spacing="-1">NoomiClone</text>
</svg>
