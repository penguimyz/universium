<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duels</title>
<link rel="icon" href="../../img/duels.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Universium look: dark glass panels, soft lilac accent, Unbounded for headings. */
  :root {
    --bg: #0f1012; --panel: rgba(20,21,25,.86); --panel-2: #1f2025; --hover: #26282d; --line: #2a2c31; --line-2: #36383e;
    --text: #ececee; --muted: #a1a3a9; --faint: #6c6f76; --accent: #b9a3ff; --accent-ink: #140e24;
    --good: #7bd88f; --bad: #ff7a7a;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --display: "Unbounded", var(--sans);
    font: 14px/1.45 var(--sans); color: var(--text);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ov { position: fixed; inset: 0; display: grid; place-items: safe center; padding: 20px; background: rgba(8,8,10,.5); backdrop-filter: blur(3px); z-index: 5; overflow: auto; }
  .box { background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; padding: 26px 28px; width: min(520px, 100%);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04); backdrop-filter: blur(14px); animation: rise .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  h1 { margin: 0; font: 800 46px/1 var(--display); letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  h2 { margin: 0 0 6px; font: 700 26px/1.1 var(--display); letter-spacing: -.02em; }
  h3 { margin: 22px 0 10px; font: 600 11.5px var(--sans); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  p { margin: 6px 0; color: var(--muted); }
  .note { font: 500 13px var(--sans); text-transform: none; letter-spacing: 0; color: var(--faint); }
  .btn { border: 1px solid var(--line-2); background: var(--panel-2); padding: 9px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; transition: background .15s, transform .1s, border-color .15s; }
  .btn:hover { background: var(--hover); border-color: #46484f; }
  .btn:active { transform: scale(.97); }
  .btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.go:hover { background: #c9b8ff; }
  .btn.on { background: color-mix(in srgb, var(--accent) 18%, var(--panel-2)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1; }
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: #121316; border: 1px solid var(--line); border-radius: 12px; }
  .seg button { border: 0; background: none; border-radius: 8px; padding: 6px 0; width: 46px; font: 700 15px var(--display); color: var(--muted); transition: background .15s, color .15s; }
  .seg button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:disabled { cursor: default; }
  .list { display: flex; flex-direction: column; gap: 4px; max-height: 250px; overflow: auto; }
  .friend { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.025); border: 1px solid var(--line); }
  .friend.pre { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .av { width: 30px; height: 30px; display: grid; place-items: center; font: 700 14px var(--display); color: #101114; flex: none; border-radius: 50%; background: hsl(var(--h) 70% 62%); }
  .state { font-size: 12.5px; color: var(--faint); }
  .state.y { color: var(--good); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; color: var(--muted); align-items: center; }
  kbd { font: 600 11px ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: var(--hover); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }
  .err { color: var(--bad); min-height: 20px; margin: 8px 0 0; }

  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 16px 0 0; }
  .pcard { border: 1px solid var(--line-2); background: rgba(255,255,255,.03); border-radius: 14px; padding: 14px; text-align: center; transition: border-color .2s, background .2s; }
  .pcard .av { width: 46px; height: 46px; margin: 0 auto 8px; font-size: 20px; }
  .pcard b { display: block; font: 700 16px var(--display); letter-spacing: -.01em; }
  .pcard small { color: var(--faint); }
  .pcard.ready { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
  .pcard.ready small { color: var(--good); }
  .pcard.left { text-align: left; }
  .pcard.left .av { margin: 0 0 8px; }
  .vs-x { font: 800 16px var(--display); color: var(--faint); }

  /* cards: dark, glowing in their type's color (ROUNDS-style) */
  #pick { background: rgba(6,6,8,.62); }
  .pick-head { display: flex; align-items: baseline; justify-content: center; gap: 14px; }
  .pick-head h2 { font-size: 34px; }
  .timer { font: 700 15px var(--display); color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(6, 176px); gap: 16px; justify-content: center; margin-top: 22px; perspective: 900px; }
  @media (max-width: 1180px) { .cards { grid-template-columns: repeat(3, 176px); } }
  @media (max-width: 600px) { .cards { grid-template-columns: repeat(2, 160px); } }
  .card { position: relative; text-align: left; padding: 0; min-height: 284px; border-radius: 16px; overflow: hidden; color: var(--text);
    background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 22%, #15161a) 0, #15161a 46%, #111215 100%);
    border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.9), 0 0 28px -10px var(--tc);
    transform: rotate(var(--tilt)); transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s; animation: deal .4s cubic-bezier(.2,.8,.2,1) both; display: flex; flex-direction: column; }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; } .card:nth-child(4) { animation-delay: .15s; } .card:nth-child(5) { animation-delay: .2s; } .card:nth-child(6) { animation-delay: .25s; }
  @keyframes deal { from { opacity: 0; transform: translateY(50px) rotateX(30deg) rotate(var(--tilt)); } }
  button.card:hover { transform: rotate(0) translateY(-10px) scale(1.03); box-shadow: 0 0 0 1px var(--tc), 0 26px 50px -18px rgba(0,0,0,.9), 0 0 44px -6px var(--tc); }
  .c-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 0; font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--tc); }
  .c-ab { background: rgba(0,0,0,.35); color: var(--text); padding: 2px 7px; border-radius: 6px; letter-spacing: .02em; font: 700 11px var(--display); text-transform: none; border: 1px solid rgba(255,255,255,.08); }
  .c-art { height: 76px; display: grid; place-items: center; }
  .c-art svg { width: 46px; height: 46px; fill: color-mix(in srgb, var(--tc) 30%, transparent); stroke: var(--tc); stroke-width: 1.5; stroke-linejoin: round; filter: drop-shadow(0 0 10px var(--tc)); }
  .c-name { font: 700 16px/1.15 var(--display); letter-spacing: -.01em; padding: 2px 12px 0; overflow-wrap: anywhere; }
  .c-name.long { font-size: 14px; }
  .c-text { font-size: 12.5px; line-height: 1.35; color: var(--muted); margin: 6px 12px 0; }
  .c-stats { list-style: none; margin: auto 0 0; padding: 10px 12px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid rgba(255,255,255,.06); }
  .c-stats li { padding: 1px 0; }
  .c-stats b { font: 700 13px var(--display); }
  .c-stats .g b { color: var(--good); } .c-stats .b b { color: var(--bad); }
  .c-key { position: absolute; top: 34px; right: 10px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.08); color: var(--muted); font: 700 11px var(--display); }
  .card.chosen { transform: rotate(0) scale(1.08); box-shadow: 0 0 0 2px var(--tc), 0 0 60px -4px var(--tc); }
  .card.dim { opacity: .25; transform: rotate(var(--tilt)) scale(.95); }

  /* card abbreviations, top right */
  #tags { position: fixed; top: 10px; right: 12px; z-index: 3; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; max-width: 46vw; }
  .tagrow { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; align-items: center; padding: 4px; border-radius: 10px; background: rgba(15,16,18,.6); backdrop-filter: blur(6px); }
  .who { font: 700 11px var(--display); color: var(--text); padding: 0 6px 0 4px; display: flex; align-items: center; gap: 6px; }
  .who::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
  .tag { font: 700 11px/1 var(--display); padding: 4px 6px; border-radius: 6px; background: color-mix(in srgb, var(--tc) 22%, #17181c); color: var(--text); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); min-width: 24px; text-align: center; }
  .tagline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }

  #banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; z-index: 4; pointer-events: none; }
  #banner .big { display: inline-block; font: 800 clamp(40px, 8vw, 96px)/1 var(--display); letter-spacing: -.03em; text-transform: uppercase; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  #banner .sub { font: 600 15px var(--sans); color: var(--text); background: rgba(15,16,18,.72); border: 1px solid var(--line-2); border-radius: 999px; display: table; margin: 12px auto 0; padding: 5px 14px; backdrop-filter: blur(6px); }
  #banner.pop { animation: slam .4s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes slam { from { opacity: 0; transform: scale(1.35); } }

  #chat { position: fixed; left: 12px; top: 52px; width: min(340px, 60vw); z-index: 6; display: flex; flex-direction: column; gap: 6px; }
  #chat.pinned { top: auto; bottom: 12px; }
  #chat-log { display: flex; flex-direction: column; gap: 3px; max-height: 180px; overflow: hidden; pointer-events: none; }
  #chat.open #chat-log, #chat.pinned #chat-log { overflow-y: auto; pointer-events: auto; }
  .msg { font-size: 13px; background: rgba(15,16,18,.72); color: var(--text); padding: 4px 10px; border-radius: 8px; width: fit-content; max-width: 100%; word-wrap: break-word; transition: opacity .6s; backdrop-filter: blur(6px); }
  .msg b { font-weight: 700; }
  .msg.sys { color: var(--muted); }
  .msg.old { opacity: 0; }
  #chat.open .msg.old, #chat.pinned .msg.old { opacity: 1; }
  #chat-form { display: none; }
  #chat.open #chat-form, #chat.pinned #chat-form { display: flex; gap: 6px; }
  #chat-inp { flex: 1; background: rgba(15,16,18,.9); border: 1px solid var(--line-2); border-radius: 10px; color: var(--text); padding: 7px 10px; font: inherit; outline: none; }
  #chat-inp:focus { border-color: var(--accent); }
  #chat-hint { font: 500 11.5px var(--sans); color: rgba(236,236,238,.4); letter-spacing: .04em; }
  #chat.open #chat-hint, #chat.pinned #chat-hint { display: none; }

  #status { position: fixed; bottom: 12px; right: 12px; z-index: 6; font: 600 13px var(--sans); background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 12px; }
  #status.bad { background: #5a2226; border-color: var(--bad); color: #fff; }
  #menu-btn { position: fixed; top: 10px; left: 12px; z-index: 6; border: 1px solid var(--line-2); background: rgba(15,16,18,.72); color: var(--text); border-radius: 10px; padding: 6px 12px; font: 600 13px var(--sans); backdrop-filter: blur(6px); }
  #menu-btn:hover { background: var(--hover); }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .score { font: 800 72px/1 var(--display); letter-spacing: -.04em; margin: 8px 0; }
  .score span { margin: 0 12px; color: var(--faint); }
  @media (max-width: 560px) { .vs, .results { grid-template-columns: 1fr; } h1 { font-size: 38px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ov" id="home" hidden>
  <div class="box">
    <h1>Duels<span>.</span></h1>
    <p>1v1 against a friend. Lose a round, pick a card. First to the goal wins.</p>
    <h3>First to</h3>
    <div class="seg" id="home-rounds"></div>
    <h3>Challenge a friend</h3>
    <div class="list" id="home-friends"><p>Loading…</p></div>
    <div id="home-invites"></div>
    <p class="err" id="home-err"></p>
    <div class="row" style="margin-top:8px"><button class="btn" id="practice">Practice vs bot</button></div>
    <h3>Controls</h3>
    <div class="keys">
      <span><kbd>A</kbd> <kbd>D</kbd></span><span>Move</span>
      <span><kbd>W</kbd> / <kbd>Space</kbd></span><span>Jump, again off walls</span>
      <span>Mouse</span><span>Aim and shoot</span>
      <span>Right click / <kbd>Shift</kbd></span><span>Block</span>
      <span><kbd>R</kbd></span><span>Reload</span>
      <span><kbd>Enter</kbd></span><span>Chat</span>
    </div>
  </div>
</div>

<div class="ov" id="room" hidden><div class="box" id="room-box"></div></div>
<div class="ov" id="pick" hidden><div id="pick-box"></div></div>
<div class="ov" id="over" hidden><div class="box" id="over-box"></div></div>

<div id="banner"></div>
<div id="tags" hidden></div>
<button id="menu-btn" hidden>Leave</button>
<div id="status" hidden></div>

<div id="chat" hidden>
  <div id="chat-log"></div>
  <form id="chat-form" autocomplete="off"><input id="chat-inp" maxlength="200" placeholder="Say something"><button class="btn sm">Send</button></form>
  <div id="chat-hint">Enter to chat</div>
</div>

<script type="module" src="game.js?v=4"></script>
</body>
</html>
