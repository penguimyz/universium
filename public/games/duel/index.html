<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duels</title>
<link rel="icon" href="../../img/duels.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e1b19; --paper: #f3ead7; --paper-2: #e6dac2; --muted: #6f665c; --yellow: #ffcf3f; --good: #2f8a3e; --bad: #c8412f;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    font: 15px/1.4 "Barlow", system-ui, sans-serif; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2622; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  h1, h2, h3, .btn, .seg button { font-family: var(--display); }

  .ov { position: fixed; inset: 0; display: grid; place-items: safe center; padding: 20px; background: rgba(20, 17, 15, .55); z-index: 5; overflow: auto; }
  .box { background: var(--paper); border: 3px solid var(--ink); padding: 24px 26px; width: min(540px, 100%); box-shadow: 8px 8px 0 var(--ink); }
  h1 { margin: 0; font-size: 64px; line-height: .9; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
  h2 { margin: 0 0 6px; font-size: 34px; line-height: 1; font-weight: 700; text-transform: uppercase; }
  h3 { margin: 20px 0 8px; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 6px 0; color: var(--muted); }
  .note { font: 500 14px "Barlow", sans-serif; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .btn { border: 2px solid var(--ink); background: var(--paper); padding: 6px 18px; font-size: 20px; font-weight: 700; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); }
  .btn:hover { background: #fff8e8; }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn.go { background: var(--yellow); }
  .btn.go:hover { background: #ffd95f; }
  .btn.on { background: var(--ink); color: var(--yellow); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--ink); }
  .btn.sm { padding: 2px 12px; font-size: 17px; box-shadow: 2px 2px 0 var(--ink); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1; }
  .seg { display: inline-flex; border: 2px solid var(--ink); }
  .seg button { border: 0; border-right: 2px solid var(--ink); background: var(--paper); padding: 4px 0; width: 48px; font-size: 22px; font-weight: 700; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
  .seg button:disabled { cursor: default; }
  .list { display: flex; flex-direction: column; max-height: 250px; overflow: auto; border-top: 2px solid var(--ink); }
  .friend { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed #b6a98f; }
  .friend.pre { background: #fff3c4; }
  .av { width: 30px; height: 30px; display: grid; place-items: center; font: 700 18px var(--display); color: var(--ink); flex: none; border: 2px solid var(--ink); background: hsl(var(--h) 62% 58%); }
  .state { font-size: 13px; color: var(--muted); }
  .state.y { color: var(--good); font-weight: 600; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 14px; }
  kbd { font: 700 13px var(--display); border: 1.5px solid var(--ink); padding: 0 5px; background: #fff; }
  .err { color: var(--bad); min-height: 20px; margin: 8px 0 0; }

  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 14px 0 0; }
  .pcard { border: 2px solid var(--ink); background: #fff8e8; padding: 12px; text-align: center; }
  .pcard .av { width: 44px; height: 44px; margin: 0 auto 6px; font-size: 26px; }
  .pcard b { display: block; font: 700 22px var(--display); text-transform: uppercase; }
  .pcard small { color: var(--muted); }
  .pcard.ready { background: #dfeecf; }
  .pcard.left { text-align: left; }
  .pcard.left .av { margin: 0 0 6px; }
  .vs-x { font: 700 26px var(--display); text-transform: uppercase; }

  /* cards */
  #pick { background: rgba(20, 17, 15, .72); }
  .pick-head { display: flex; align-items: baseline; justify-content: center; gap: 14px; color: var(--paper); }
  .pick-head h2 { font-size: 46px; }
  .timer { font: 700 22px var(--display); }
  .cards { display: grid; grid-template-columns: repeat(6, 176px); gap: 14px; justify-content: center; margin-top: 18px; }
  @media (max-width: 1180px) { .cards { grid-template-columns: repeat(3, 176px); } }
  @media (max-width: 600px) { .cards { grid-template-columns: repeat(2, 160px); } }
  .card { position: relative; text-align: left; background: var(--paper); border: 3px solid var(--ink); padding: 0; min-height: 280px;
    box-shadow: 6px 6px 0 rgba(0,0,0,.55); transform: rotate(var(--tilt)); transition: transform .12s, box-shadow .12s; animation: deal .3s both; display: flex; flex-direction: column; }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; } .card:nth-child(4) { animation-delay: .15s; } .card:nth-child(5) { animation-delay: .2s; } .card:nth-child(6) { animation-delay: .25s; }
  @keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(var(--tilt)); } }
  button.card:hover { transform: rotate(0) translateY(-8px); box-shadow: 10px 12px 0 rgba(0,0,0,.55); }
  .c-top { display: flex; justify-content: space-between; align-items: center; background: var(--tc); color: #fff; padding: 3px 8px; border-bottom: 3px solid var(--ink);
    font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .08em; }
  .c-ab { background: var(--ink); color: var(--paper); padding: 0 6px; letter-spacing: .02em; font-size: 15px; text-transform: none; }
  .c-art { height: 70px; display: grid; place-items: center; border-bottom: 2px solid var(--ink);
    background: repeating-linear-gradient(-45deg, var(--paper-2) 0 6px, var(--paper) 6px 12px); }
  .c-art svg { width: 44px; height: 44px; fill: var(--tc); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
  .c-name { font: 700 24px/1 var(--display); text-transform: uppercase; padding: 8px 10px 0; overflow-wrap: anywhere; }
  .c-name.long { font-size: 20px; }
  .c-text { font-size: 13px; line-height: 1.3; color: #4c453d; margin: 4px 10px 0; }
  .c-stats { list-style: none; margin: auto 0 0; padding: 8px 10px 10px; font-size: 13.5px; }
  .c-stats li { padding: 1px 0; }
  .c-stats b { font: 700 16px var(--display); }
  .c-stats .g b { color: var(--good); } .c-stats .b b { color: var(--bad); }
  .c-key { position: absolute; bottom: -12px; right: -12px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--yellow); border: 2px solid var(--ink); font: 700 16px var(--display); }
  .card.chosen { transform: rotate(0) scale(1.06); box-shadow: 0 0 0 5px var(--yellow), 8px 8px 0 rgba(0,0,0,.55); }
  .card.dim { opacity: .3; }

  /* card abbreviations, top right */
  #tags { position: fixed; top: 8px; right: 10px; z-index: 3; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; max-width: 46vw; }
  .tagrow { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .who { font: 700 14px var(--display); text-transform: uppercase; color: var(--paper); padding: 0 6px 0 0; border-right: 5px solid var(--pc); margin-right: 3px; }
  .tag { font: 700 14px/1 var(--display); padding: 3px 5px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-bottom-width: 4px; border-bottom-color: var(--tc); min-width: 24px; text-align: center; }
  .tagline { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; }

  #banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; z-index: 4; pointer-events: none; }
  #banner .big { display: inline-block; font: 700 clamp(44px, 9vw, 110px)/1 var(--display); text-transform: uppercase; color: var(--paper); background: var(--ink); padding: 4px 22px 8px; transform: rotate(-2deg); }
  #banner .sub { font: 600 22px var(--display); text-transform: uppercase; color: var(--ink); background: var(--yellow); display: table; margin: 8px auto 0; padding: 0 12px; }
  #banner.pop { animation: slam .35s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes slam { from { opacity: 0; transform: scale(1.4); } }

  #chat { position: fixed; left: 10px; top: 44px; width: min(340px, 60vw); z-index: 6; display: flex; flex-direction: column; gap: 5px; }
  #chat.pinned { top: auto; bottom: 12px; }
  #chat-log { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow: hidden; pointer-events: none; }
  #chat.open #chat-log, #chat.pinned #chat-log { overflow-y: auto; pointer-events: auto; }
  .msg { font-size: 14px; background: rgba(30, 27, 25, .82); color: var(--paper); padding: 2px 8px; width: fit-content; max-width: 100%; word-wrap: break-word; transition: opacity .6s; }
  .msg b { font-family: var(--display); font-size: 15px; text-transform: uppercase; }
  .msg.sys { color: #bdb3a2; font-style: italic; }
  .msg.old { opacity: 0; }
  #chat.open .msg.old, #chat.pinned .msg.old { opacity: 1; }
  #chat-form { display: none; }
  #chat.open #chat-form, #chat.pinned #chat-form { display: flex; gap: 6px; }
  #chat-inp { flex: 1; background: var(--paper); border: 2px solid var(--ink); color: var(--ink); padding: 5px 8px; font: inherit; outline: none; }
  #chat-hint { font: 500 14px var(--display); color: rgba(243,234,215,.45); text-transform: uppercase; letter-spacing: .04em; }
  #chat.open #chat-hint, #chat.pinned #chat-hint { display: none; }

  #status { position: fixed; bottom: 10px; right: 10px; z-index: 6; font: 600 16px var(--display); background: var(--paper); border: 2px solid var(--ink); padding: 2px 10px; }
  #status.bad { background: var(--bad); color: #fff; }
  #menu-btn { position: fixed; top: 8px; left: 10px; z-index: 6; border: 2px solid var(--ink); background: var(--paper); padding: 0 10px; font: 700 16px var(--display); text-transform: uppercase; box-shadow: 2px 2px 0 var(--ink); }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .score { font: 700 90px/1 var(--display); margin: 4px 0; }
  .score span { margin: 0 10px; color: var(--muted); }
  @media (max-width: 560px) { .vs, .results { grid-template-columns: 1fr; } h1 { font-size: 48px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ov" id="home" hidden>
  <div class="box">
    <h1>Duels</h1>
    <p>1v1 against a friend. Lose a round, pick a card. First to the goal wins.</p>
    <h3>First to</h3>
    <div class="seg" id="home-rounds"></div>
    <h3>Challenge a friend</h3>
    <div class="list" id="home-friends"><p>Loading…</p></div>
    <div id="home-invites"></div>
    <p class="err" id="home-err"></p>
    <div class="row" style="margin-top:8px"><button class="btn" id="practice">Practice vs bot</button></div>
    <h3>Controls</h3>
    <div class="keys">
      <span><kbd>A</kbd> <kbd>D</kbd></span><span>Move</span>
      <span><kbd>W</kbd> / <kbd>Space</kbd></span><span>Jump, again off walls</span>
      <span>Mouse</span><span>Aim and shoot</span>
      <span>Right click / <kbd>Shift</kbd></span><span>Block</span>
      <span><kbd>R</kbd></span><span>Reload</span>
      <span><kbd>Enter</kbd></span><span>Chat</span>
    </div>
  </div>
</div>

<div class="ov" id="room" hidden><div class="box" id="room-box"></div></div>
<div class="ov" id="pick" hidden><div id="pick-box"></div></div>
<div class="ov" id="over" hidden><div class="box" id="over-box"></div></div>

<div id="banner"></div>
<div id="tags" hidden></div>
<button id="menu-btn" hidden>Leave</button>
<div id="status" hidden></div>

<div id="chat" hidden>
  <div id="chat-log"></div>
  <form id="chat-form" autocomplete="off"><input id="chat-inp" maxlength="200" placeholder="Say something"><button class="btn sm">Send</button></form>
  <div id="chat-hint">Enter to chat</div>
</div>

<script type="module" src="game.js?v=3"></script>
</body>
</html>
